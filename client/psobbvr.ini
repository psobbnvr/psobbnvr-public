; PSOBB VR mod settings. Changes take effect at the next game launch,
; except [bindings], which the running game reloads when this file is saved.

[render]
; Real render resolution (the game thinks it renders 640x480). Keep 4:3
; (1024x768, 1280x960, 1600x1200, 2880x2160) or the image stretches. The
; default supersamples for sharper edges; lower it if a level slows down.
width=2880
height=2160

[stereo]
; Side-by-side stereo in the flat desktop window, which is then twice
; [render] width wide. 1 = on.
enabled=1
; Eye distance in world units for the flat window only; the headset uses
; its own eye distance. Change [vr] world_scale for world size instead.
separation=0.7
; 1 = left-eye view on the right half (cross-eye viewing). 0 = left on the
; left, so the window mirrors the headset (default).
cross_eye=0

[vr]
; Send the image to SteamVR and drive the camera from the headset.
; Needs SteamVR and a headset; see vr_fail_* below for what happens if it
; cannot start.
enabled=1
; openxr = smooth head rotation at the headset's refresh rate even though
; the game runs at 30 FPS; needs SteamVR 2.17 or later. openvr = works
; on any SteamVR, as a fallback (menus and HUD follow your head).
backend=openxr
; Renders this much wider than the headset shows, so fast head turns show
; picture instead of black edges (openxr only). 1 = off. Wider costs some
; sharpness (1.15 = about 13% per axis).
fov_margin=1.15
; Game units per meter. 9 = life size (the character at its true height).
; Larger values make the world look smaller.
world_scale=9
; Near and far clipping distances, in meters.
near_m=0.05
far_m=1500
; The HUD sits on a virtual screen: its distance in meters and its width
; in degrees of view.
hud_distance_m=1.5
hud_width_deg=60
; 1 = the HUD is its own layer placed by the headset compositor, so it
; stays steady (openxr only). 0 = drawn into the eye images.
hud_layer=1
; HUD layer width in pixels (height is 3/4 of it).
hud_tex_width=1600
; Where the HUD sits (needs hud_layer=1). 0 = follows your head. 1 = in
; front of your character, turning with its stick turns but not with your
; head or attacks (default). 2 = fixed where you faced at the last recenter.
hud_lock=1
; On-screen keyboard: appears whenever the game opens a text field. Point
; a controller's beam at a key and pull the trigger; a pull off the panel
; is Enter (right hand) or Backspace (left hand). 0 = off.
vr_keyboard=1
; Keyboard placement in meters: distance ahead, drop below eye level, and
; width.
keyboard_distance_m=0.7
keyboard_drop_m=0.3
keyboard_width_m=0.8
; 1 = title, login, character select and loading screens stay fixed in the
; room instead of following your head, so looking around them is smooth
; (openxr only).
menu_lock=1
; Menu screen distance (meters), width (degrees) and backdrop distance
; (meters).
menu_distance_m=2.0
menu_width_deg=70
menu_below_distance_m=3.5
; 1 = menu glow effects blend into the backdrop as in the flat game.
glow_below=1
; 1 = warp tunnels (lobby, game and area warps) drawn in 3D around you
; instead of flat.
burst_3d=1
; Moves the game's own camera with your head, so sprites, culling and sound
; follow your view. 0 = off, 1 = on while VR runs (normal), 2 = on without
; VR too (a flat-screen first-person view).
game_camera=1
; Eye height above the character's feet, in meters. Only used when
; eye_height_auto is 0 or before the character's height is measured.
eye_height_m=1.58
; 1 = eye height follows the character's measured head height, so it fits
; every character. 0 = use eye_height_m.
eye_height_auto=1
; Eyes above the head's pivot point, meters. Too low feels like looking
; from the chest; too high clips the view when a tall character looks down.
eye_offset_m=0.36
; Eyes forward of the head's center, meters. Too little shows the inside
; of the neck; too much hides the chest when looking down.
eye_forward_m=0.16
; Extra forward shift at a full run (the run leans the body forward),
; meters. 0 = off.
run_forward_m=0.26
; Downward shift at a full run, meters. 0 = off.
run_down_m=0
; 1 = the turn an attack makes toward its target does not turn your view;
; the character turns back afterwards. 0 = it does.
attack_view_hold=1
; 1 = each combo step re-targets the enemy you are looking at. 0 = the
; whole combo keeps the first target, as in the original game.
attack_retarget=1
; How far from your gaze (degrees) an enemy may be to be re-targeted.
retarget_cone_deg=45
; Widens the area in which the game considers things visible, so items,
; teleporters, the mag and weapons don't pop out at the headset's view edges.
; 1 = original, smaller = wider (0.3 covers all known cases).
cull_fov_scale=0.3
; The same in towns (Pioneer 2), narrower there because it costs speed.
; 0 = use cull_fov_scale.
cull_fov_scale_town=0.7
; Multiplies how far away level geometry is drawn (the original is 60 m in
; Episode 1). Higher shows more and costs speed. Range 0.25-16.
draw_distance_scale=4
; Hides your own head from the inside in first person: close draws are
; skipped and their textures remembered, so the head stays hidden as it
; moves while the mag and weapon stay visible. Radii in meters.
trim_head=1
trim_radius_m=0.25
trim_wide_m=1.2
; Head-hiding anchor height above the feet, meters. Only used when
; eye_height_auto is 0.
trim_anchor_m=1.6
; Hides the inside of your body when you look down. 0 = off, 1 and 2 =
; the two face windings; if you see holes in the outside of your body, try
; the other one.
body_cull=1
; Keyboard turning speed. 1 = the original (337 degrees/s); 0.4 = about
; 135 degrees/s.
turn_speed_scale=0.4
; Keyboard only: 1 = back walks backwards instead of turning around.
back_strafe=1
; Speed while walking backwards.
back_speed_scale=0.85
; Keyboard only: 1 = a turn key alone turns on the spot instead of walking
; sideways.
side_turn=1
; Movement speed while turning on the spot (near 0 = stand still).
side_turn_speed_scale=0.05
; Size of damage, MISS and EXP numbers. 1 = the flat game's size.
text_scale=0.5
; 1 = name and level labels over other players sit at their heads in
; both eyes. 0 = the game's own placement, which floats and slides.
name_labels=1
; How precisely a gun must point at an enemy to target it. 1 = the
; weapon's normal range; smaller = more precise. Range 0.2-1.5.
target_aim_cone_scale=0.6
; 1 = bullets leave the gun in your hand instead of the character's body;
; unlocked shots fly along the visible barrel. Muzzle offset in meters
; along the barrel.
gun_fire_origin=1
gun_muzzle_offset_m=0.10
; Barrel direction trim in degrees (positive = down). Normally 0.
gun_barrel_pitch_deg=0
; 1 = techniques are readied by the trigger and cast by swinging your
; right hand. 0 = they cast on the button press.
cast_swing=1
; 1 = a left-hand swing casts too, for techniques the left hand does not
; aim (Resta, Shifta, Zonde ...). 0 = right hand only.
cast_left_hand=1
; 1 = the character turns toward the target during a cast (original).
; 0 = no turn; the spell still hits its target.
cast_facing_snap=0
; The left hand aims Foie, Rafoie, Barta, Gibarta, Gizonde and Megid.
; Aiming precision in degrees for Foie, Barta and Megid (5-90).
cast_aim_cone_deg=15
; Which techniques the left hand aims. -1 = all of the above. Otherwise a
; bitmask of technique ids (0 Foie, 1 Gifoie, 2 Rafoie, 3 Barta, 4 Gibarta,
; 5 Rabarta, 6 Zonde, 7 Gizonde, 8 Razonde, 9 Grants, 10 Deband, 11 Jellen,
; 12 Zalure, 13 Shifta, 14 Ryuker, 15 Resta, 16 Anti, 17 Reverser,
; 18 Megid); 0 = none.
cast_aim_techs=-1
; With a gun: 1 = the character turns toward the target when firing
; (original). 0 = no turn.
gun_facing_snap=0
; Mechguns in both hands. mechgun_dual: each barrel follows its own hand
; and targets what that hand points at; each bullet does half damage, so
; both hands on one enemy deal full damage. swap_barrels flips the hands.
; reticle: a second, rotated reticle marks the left hand's target.
; union: the left hand locks on when the right sees nothing.
; merge_popups: two half-damage numbers on one enemy show as one total.
mechgun_dual=1
mechgun_swap_barrels=0
mechgun_reticle=1
mechgun_union=1
mechgun_merge_popups=1
; Controller vibration. gun_haptic: 0 = off, 1 = on each trigger pull,
; 2 = on each bullet fired. hit_haptic: when your melee hit lands.
; hurt_haptic: when you take damage. _amp = strength 0-1, _s = seconds.
gun_haptic=2
gun_haptic_amp=1.0
gun_haptic_s=0.05
hit_haptic=1
hit_haptic_amp=1.0
hit_haptic_s=0.08
hurt_haptic=1
hurt_haptic_amp=0.7
hurt_haptic_s=0.12
; Glow sprites closer than this (game units) are treated as HUD rather
; than world. Raise it if HUD glow ever floats in the world.
sprite_near_floor=4
; 1 = everything the game's menu system draws counts as HUD, whatever its
; depth (keeps menu cursors from vanishing). 0 = depth only.
ui_caller_rule=1
; 1 = see-through sprites such as grass and fog are placed in the world
; instead of flat on the HUD. 0 = glow sprites only.
alpha_sprite_rule=1
; See-through sprites closer than this (game units) are not drawn, so fog
; at your face does not darken the HUD.
alpha_sprite_floor=1
; Tall effect sprites (like the telepipe beam) stand upright instead of
; leaning as you tilt your head. 1 = the effect pools listed in
; sprite_upright_pools, 0 = off.
sprite_upright=1
sprite_upright_pools=24
; Melee attacks: 2 = the trigger readies an attack and a swing fires it;
; heavy and special attacks charge on the press and wait for a swing
; (default). 1 = all three wait for a swing. 0 = attacks fire on the press.
swing_attack=2
; 1 = bare-handed punches also need a swing. 0 = they fire on the press.
swing_unarmed=1
; 1 = a charged heavy or special attack waits for your swing; with no
; swing within timeout_s seconds it is cancelled (0 = wait forever).
charge_hold=1
charge_hold_timeout_s=3
; A swing-fired attack skips its wind-up, so the hit lands mid-swing, and
; after each hit pauses for the wind-up it skipped, so hits keep the
; original game's pace. margin = animation steps before the hit frame.
swing_warp_margin=0.5
; Extra game ticks (30 per second) to swing the next combo step. 0 = off.
combo_window_bonus=6
; Multi-hit weapons (daggers, double sabers, twin swords): 1 = each extra
; hit in a step waits for its own swing, cancelled after cap ticks (30 per
; second). margin = animation steps short of the hit (keep 1 or more).
swing_row_hold=1
swing_row_hold_margin=1.5
swing_row_hold_cap=30
; Twin weapons (daggers, knuckles, twin swords): 1 = left-hand swings
; count too, so combos can go hand over hand. 0 = right hand only.
swing_left_hand=1
; Swing-timing indicator above the HUD, shown while the game's action
; palette is: green = a swing starts an attack or the next combo step,
; blue = lands the next hit, grey = not yet, red flash = pressed too
; early. The ring shrinks and lands as it turns green. Position in 640x480
; screen units; ring and ring_end = the ring's start and end size; scale =
; hexagon size; spin = game ticks per ring frame.
swing_indicator=1
swing_indicator_x=320
swing_indicator_y=76
swing_indicator_ring=100
swing_indicator_ring_end=28
swing_indicator_scale=2
swing_indicator_spin=1
; Both triggers make a special attack only if the second comes within this
; many seconds of the first.
trig_pair_window_s=0.25
; 1 = NPCs and objects no longer vanish at the edges of your view, and
; objects behind you stay active (boxes can still be hit by Zonde or
; Megid).
object_vis_fix=1
; 1 = stops your mag jumping sideways for a moment when you look behind you.
mag_glitch_fix=1
; 1 = stops other players' mags swinging around as you turn your head.
mag_root_sync=1
; 1 = bullet trails follow the bullet's real path instead of hanging at a
; fixed depth.
trail_depth_fix=1
; 1 = a crossed second copy of each trail, so it looks solid from any angle.
trail_cross=1
; Trail brightness with the cross on (0-1; 0.5 = original core brightness).
trail_cross_gain=0.6
; 1 = motion controllers (hand tracking, buttons, sticks, vibration).
; 0 = none.
controllers=1
; 1 = controller buttons keep working when another window has focus
; (Steam Link, the SteamVR dashboard). The real keyboard is only read
; while the game has focus.
unfocused_input=1
; Startup checks. allow_any_runtime=1 starts on an OpenXR runtime other
; than SteamVR (untested). vr_fail_message=0 hides the error box if VR
; cannot start. vr_fail_exit=1 closes the game after that box.
allow_any_runtime=0
vr_fail_message=1
vr_fail_exit=1
; 1 = a hotkey holding a technique (or, with a melee weapon, an attack) is
; readied while held and fires on a swing; items use at once. Expires after
; hotkey_arm_timeout_s seconds. 0 = hotkeys act on press.
hotkey_arm=1
hotkey_arm_timeout_s=10
; Fixed controls: left stick walks; right stick turns (arrow keys in
; menus; hotkeys with the left grip held); triggers use the action palette
; (right, left, both) or confirm / back in menus. Buttons are in [bindings].
; stick_locomotion=0 only: right-stick turn speed range, light push to
; full push (1 = the original 337 degrees/s). With analog stick movement
; the right stick turns at stick_turn_deg_s instead.
controller_turn_min=0.1
controller_turn_max=0.4
; Stick deadzone (0-0.6), and how far a trigger or grip must be pressed to
; count as a press (0.2-0.95).
controller_deadzone=0.15
controller_press=0.6
; Set -1 if walking or turning sideways is mirrored.
controller_side_sign=1
; 1 = analog stick movement: left stick walks and strafes at any speed,
; right stick turns. 0 = the sticks act like keys.
stick_locomotion=1
; Right-stick maximum turn speed, degrees per second.
stick_turn_deg_s=140
; Walking speed at the lightest stick push (full push = 1).
stick_speed_floor=0.15
; Which way a forward push of the left stick walks.
; 0 = the way your character faces. 2 = the way you look; your character
; turns to match as you walk. 1 = the way you look, but your character
; keeps its facing.
head_move=0
; 1 = hide the character's own arms in first person (your VR hands and
; weapon replace them). count = how many body draws are arms (58 = HUmar),
; used until your hand is captured, which sets it for each character.
hide_arms=1
hide_arms_count=58
; 1 = the equipped weapon is held in your right controller.
weapon_grip=1
; Size of your held weapon. 1 = the game's size (oversized in VR).
weapon_scale=0.7
; 1 = your character's hands are drawn at your controllers.
hand_presence=1
; Hand size.
hand_scale=0.7
; Hand angle trim in degrees; negative tips the hand down. Does not move
; the weapon.
hand_pitch_deg=-10
; How a melee weapon sits in your hand. pitch tips the blade up or down,
; roll spins it about the blade, yaw swings it left or right (degrees);
; fwd and up shift it along the grip (centimeters).
grip_pitch_deg=-10
grip_roll_deg=180
grip_yaw_deg=0
grip_fwd_cm=-3
grip_up_cm=0
; The same for guns (positive pitch = barrel up).
gun_pitch_deg=40
gun_roll_deg=180
gun_yaw_deg=0
gun_fwd_cm=5
gun_up_cm=0
; Claws and other fist weapons, held still at the game's idle pose.
; fist_* trim the weapon only, with side_cm pushing it across the palm.
fist_pitch_deg=-40
fist_roll_deg=0
fist_yaw_deg=0
fist_fwd_cm=11
fist_up_cm=-12
fist_side_cm=-1
; 1 = hide the sun glow and lens flares in VR (they can't be placed in the
; world). The flat game is unaffected.
hide_sun=1

[registry]
; 1 = the game keeps its settings in HKCU\Software\psobbvr\PSOBB instead
; of the key shared by every PSOBB install. Preferences saved by the stock
; option.exe into the shared key are copied over at launch. 0 = shared key.
redirect=1

[debug]
; 1 = write psobbvr-vr.log in the game folder (the previous two are kept
; as .1 and .2). Send it with bug reports.
enabled=1

[bindings]
; Controller buttons: which button or grip+button chord does which action.
; Saving this file applies it to a running game within a second. The
; Options program (psobbvr_options.exe) edits this section for you; the
; loaded table and any rejected line are written to psobbvr-vr.log.
;
; Grammar: action = chord[, chord ...]   or   action = none
;   chord  = [left_grip+][right_grip+]button
;   button = a, b, x, y, left_grip, right_grip, left_stick_click,
;            right_stick_click, menu (either hand), left_menu, right_menu,
;            right_stick_up / right_stick_right / right_stick_down /
;            right_stick_left (a firm flick; needs a grip held, since the
;            bare stick turns)
; Case and spaces don't matter. Actions not set here (or set wrongly) keep
; their defaults. The triggers can't be bound.
;
; Rules (a chord that breaks one is dropped and logged):
;   - the bank2 grip (the game's Ctrl, which switches the three trigger
;     slots to their alternate set) can't be a hotkey chord's only
;     modifier: the game ignores its hotkeys while Ctrl is held;
;   - a grip used as a modifier can't also have its own binding (except
;     bank2);
;   - one chord, one action: a line here beats a default; between two lines
;     here the later one is dropped.
; When several chords match, the one with the most grips other than bank2
; wins, then the most grips: "right_grip+b" beats "b" with the right grip
; held, and with both grips held "left_grip+b" beats "right_grip+b" (so
; both grips + a hotkey chord does nothing: the hotkey is sent with Ctrl
; held). "a" still fires with the right grip held.
; With the Quick Menu open, pressing its chord again changes tab.
; The menu buttons are unbound by default (on a Quest they open the Steam
; and Meta menus); to add them: menu = right_grip+b, menu
;
; Defaults - uncomment a line to change it:
;menu              = right_grip+b
;confirm           = right_stick_click
;cancel            = left_stick_click
;recenter          = right_grip+left_stick_click
;bank2             = right_grip
;quick_chat        = a
;quick_menu        = none
;tab               = y
;chat              = right_grip+x
;hotkey1           = left_grip+a
;hotkey2           = left_grip+b
;hotkey3           = left_grip+x
;hotkey4           = left_grip+y
;hotkey5           = left_grip+right_stick_up
;hotkey6           = left_grip+right_stick_right
;hotkey7           = left_grip+right_stick_down
;hotkey8           = left_grip+right_stick_left
;hotkey9           = left_grip+right_stick_click
;hotkey0           = left_grip+left_stick_click
;nav_left          = none
;nav_right         = none
;nav_up            = none
;nav_down          = none
